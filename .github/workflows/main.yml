name: Build Root Gradle Project

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'  # 改为你的JDK版本

    # 根目录直接执行构建
    - name: Build Gradle Project
      run: |
        # 添加执行权限（如果使用 Gradle Wrapper）
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew build -x test
        else
          gradle build -x test
        fi

    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jar-artifact
        path: build/libs/*.jar  # 根目录下的输出路径
