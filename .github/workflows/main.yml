name: Build JAR

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'  # 修改为你的JDK版本

    - name: Grant Gradle permission
      run: chmod +x gradlew  # 给Gradle Wrapper执行权限

    - name: Build with Gradle
      run: ./gradlew build  # 执行编译

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: generated-jar
        path: build/libs/*.jar  # 自动上传所有生成的JAR
